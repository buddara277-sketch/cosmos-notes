
name: Build Cosmos Notes APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.COSMOS_KEYSTORE_BASE64 }}
          COSMOS_KEYSTORE_PASSWORD: ${{ secrets.COSMOS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/cosmos-notes-release.jks
          test -s android/app/cosmos-notes-release.jks
          keytool -list -keystore android/app/cosmos-notes-release.jks -storepass "$COSMOS_KEYSTORE_PASSWORD" -alias cosmosnotes >/dev/null

      - name: Build signed release APK
        env:
          COSMOS_KEYSTORE_FILE: ${{ github.workspace }}/android/app/cosmos-notes-release.jks
          COSMOS_KEYSTORE_PASSWORD: ${{ secrets.COSMOS_KEYSTORE_PASSWORD }}
          COSMOS_KEY_ALIAS: cosmosnotes
          COSMOS_KEY_PASSWORD: ${{ secrets.COSMOS_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --info --console=plain --no-parallel --max-workers=2 assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cosmos-Notes-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
